
name: build-and-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.corvane.example
  IMAGE: stockdesk
  NODE_VERSION: "24"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests
        run: npm test

      - name: Scan files for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            dir --redact --verbose /repo

      - name: Scan configuration files
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            "$TRIVY_IMAGE" \
            config --exit-code 1 --severity HIGH,CRITICAL /repo

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      image-ref: ${{ steps.push.outputs.image_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build --pull \
            -t "$REGISTRY/$IMAGE:$GITHUB_SHA" .

      - name: Scan image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "$REGISTRY/$IMAGE:$GITHUB_SHA"

      - name: Generate SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            "$TRIVY_IMAGE" \
            image --format cyclonedx \
            --output /out/sbom.cdx.json \
            "$REGISTRY/$IMAGE:$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Push image to registry
        id: push
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "$DEPLOY_TOKEN" | docker login "$REGISTRY" \
            -u ci-bot --password-stdin

          docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"

          image_ref="$(docker inspect \
            --format '{{index .RepoDigests 0}}' \
            "$REGISTRY/$IMAGE:$GITHUB_SHA")"

          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

          docker logout "$REGISTRY"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: test-cluster

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

     
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
        run: |
          umask 077

          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"

          trap 'rm -f "$KUBECONFIG"' EXIT

          printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"

          sed "s|IMAGE_REF_SET_BY_CI|$IMAGE_REF|" \
            k8s/deployment.yaml |
            kubectl apply -n stockdesk -f -

          kubectl rollout status deployment/stockdesk \
            -n stockdesk --timeout=120s
