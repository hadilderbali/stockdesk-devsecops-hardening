
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stockdesk
  namespace: stockdesk
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockdesk
  namespace: stockdesk
  labels:
    app: stockdesk

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: stockdesk

  template:
    metadata:
      labels:
        app: stockdesk

    spec:
      serviceAccountName: stockdesk
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: stockdesk
          image: IMAGE_REF_SET_BY_CI
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - secretRef:
                name: stockdesk-env

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi

---
apiVersion: v1
kind: Service
metadata:
  name: stockdesk
  namespace: stockdesk

spec:
  type: ClusterIP

  selector:
    app: stockdesk

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
