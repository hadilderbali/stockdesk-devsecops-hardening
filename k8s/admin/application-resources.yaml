
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stockdesk
  namespace: stockdesk
automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: stockdesk
  namespace: stockdesk
spec:
  type: ClusterIP
  selector:
    app: stockdesk
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
